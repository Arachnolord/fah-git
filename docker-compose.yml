# FAH-Git als ZIP-App auf FAH-NAS. Werte aus .env (legt manage.sh beim ersten Lauf an).
services:
  fah-git:
    build: .
    image: fah-git:${FAHGIT_VERSION:-lokal}
    restart: unless-stopped
    ports:
      - "${PORT:-3300}:3300"
    environment:
      TZ: Europe/Berlin
      # Optional: feste Adresse für Klon-Links (sonst die, unter der FAH-Git aufgerufen wird).
      FAHGIT_ADRESSE: ${ADRESSE:-}
      # Fail-over (1.14.0): ROLLE=ersatz macht diese Instanz zum Ersatz, der sich laufend vom Haupt abgleicht und nur lesen
      # lässt. Koppeln geht in der Oberfläche; wahlweise hier HAUPT=http://<haupt>:3300 und KOPPLUNG=fgfo_… (Code vom Haupt).
      FAHGIT_ROLLE: ${ROLLE:-}
      FAHGIT_HAUPT: ${HAUPT:-}
      FAHGIT_KOPPLUNG: ${KOPPLUNG:-}
    volumes:
      - ./daten:/daten
      # Release-Ablage (1.12.0): Ordner mit fertigen ZIPs/ISOs, NUR LESEND. In der .env: ABLAGE=<Ordner auf dem NAS>.
      # Ohne Eintrag ein leerer Ordner im App-Ordner – der Reiter „Releases“ meldet dann „nicht eingebunden“.
      - ${ABLAGE:-./ablage}:/ablage:ro
    # Sparsam: Git-Server für eine Handvoll Nutzer. Adblock und Proxy auf demselben Rechner gehen vor.
    cpus: 1.0
    cpu_shares: 512
    mem_limit: 512m
    labels:
      fahnas.webui: "http://{HOST}:${PORT:-3300}/"

  # Fail-over-Selbstupdate (1.15.2): NUR auf dem Ersatz. Das Profil „ersatz“ schaltet manage.sh ein, wenn in der .env
  # ROLLE=ersatz steht – auf dem Haupt (z. B. FAH-NAS) startet dieser Dienst nie. Er startet alle 2 Minuten
  # „manage.sh auto-update“: ohne Netz, sieht nur Docker und diesen App-Ordner (unter demselben Pfad, damit die Pfade
  # in Docker-Aufrufen stimmen). Das Abbild fah-git-updater:lokal baut manage.sh (alpine + docker-cli, nichts weiter).
  updater:
    image: fah-git-updater:lokal
    profiles: ["ersatz"]
    restart: unless-stopped
    network_mode: none
    mem_limit: 256m
    environment:
      FAHGIT_ROOT: ${FAHGIT_ROOT:-/fahgit-ordner-fehlt}
    working_dir: ${FAHGIT_ROOT:-/fahgit-ordner-fehlt}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FAHGIT_ROOT:-/fahgit-ordner-fehlt}:${FAHGIT_ROOT:-/fahgit-ordner-fehlt}
